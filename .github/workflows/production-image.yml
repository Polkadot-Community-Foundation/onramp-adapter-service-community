name: Production image

# PCF production: a dispatch on `production` builds the onramp image, pushes it to the production
# registry tagged `production-<YYYY-MM-DD>.<n>` behind the `production` environment approval, then
# tags the built commit `production/<YYYY-MM-DD>.<n>`. It does not deploy. A dispatch on any other
# ref is refused.
#
# This workflow is the only path to the production registry. The push job runs in the `production`
# GitHub environment, which requires a reviewer, and its credentials are keyless (GitHub OIDC ->
# Workload Identity Federation) and only issued to that environment. Registry and identity come
# from production environment variables, so a missing value fails the run. Registry tags are
# immutable.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-image
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require the production branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/production" ]; then
            echo "::error::production-image.yml only publishes from refs/heads/production (ref was $REF)"
            exit 1
          fi

  # The release gate from release.yml.
  verify:
    needs: guard
    name: Verify (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same Postgres `ci.yml` gives its test jobs. Without it this gate failed every run from
    # the CloudSQL migration until this block landed: `npm run verify` and `npm run test:e2e`
    # both need a database, and nothing was published in between. The gate that says "the artefact
    # about to be published works" was the one artefact nobody was watching.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: onramp-test
          POSTGRES_DB: onramp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ONRAMP_TEST_PG: postgres://postgres:onramp-test@localhost:5432/onramp_test
    steps:
      # Same SHA pins as ci.yml: a tag is mutable, so `@v4` is a third party able to change
      # what runs in the workflow that deploys to production.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.2
      # `check:chart` schema-validates the rendered manifests offline; without the binary the
      # gate silently degrades to "does it render".
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: 0.8.0
        run: |
          set -euo pipefail
          base="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}"
          archive="kubeconform-linux-amd64.tar.gz"

          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o CHECKSUMS "$base/CHECKSUMS"

          # The version pin only binds a filename; verifying the published checksum binds the
          # bytes, so a replaced release asset cannot change the gate silently.
          grep " ${archive}\$" CHECKSUMS | sha256sum -c -

          sudo tar -xzf "$archive" -C /usr/local/bin kubeconform
          kubeconform -v
      - run: npm ci
      - run: npm run verify
      - run: npm run test:e2e
      - run: npm run check:chart

  push:
    needs: [guard, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      release: ${{ steps.release.outputs.name }}
      image: ${{ steps.summary.outputs.image }}
    env:
      IMAGE_REPO: ${{ vars.IMAGE_REGISTRY }}/onramp-adapter-service
    steps:
      - name: Require production configuration
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in IMAGE_REGISTRY GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the production environment"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - id: release
        name: Release name
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          LAST=$(git ls-remote --tags origin "refs/tags/production/${DATE}.*" \
            | sed -n "s#.*refs/tags/production/${DATE}\.\([0-9]*\)\$#\1#p" | sort -n | tail -1)
          NAME="production/${DATE}.$(( ${LAST:-0} + 1 ))"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${NAME/\//-}" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - run: gcloud auth configure-docker "${IMAGE_REPO%%/*}" --quiet

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # See reusable-build-images.yml: buildx only reads the Actions cache through these.
      - name: Expose the Actions cache to buildx
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bake and push
        run: |
          set -euo pipefail
          docker buildx bake app \
            --file docker-bake.hcl \
            --set "app.tags=$IMAGE_REPO:$IMAGE_TAG" \
            --set "app.args.VCS_REF=$(git rev-parse HEAD)" \
            --set "app.args.BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --set "*.attest=type=sbom" \
            --set "*.attest=type=provenance,mode=max" \
            --set "*.cache-from=type=gha,scope=production" \
            --set "*.cache-to=type=gha,scope=production,mode=max,ignore-error=true" \
            --push

      - id: summary
        name: Summary
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE_REPO:$IMAGE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=$IMAGE_REPO:$IMAGE_TAG@$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Pushed"
            echo
            echo '```'
            echo "$IMAGE_REPO:$IMAGE_TAG"
            echo "$IMAGE_REPO@$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    needs: push
    name: Tag the built commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Tag the built commit
        env:
          TAG: ${{ needs.push.outputs.release }}
          IMAGE: ${{ needs.push.outputs.image }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "onramp production image $IMAGE, run ${GITHUB_RUN_ID}"
          git push origin "refs/tags/$TAG"
          echo "### Tagged \`$TAG\` at ${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"
